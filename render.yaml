# Render blueprint for the client demo.
#
# One Docker web service hosts both the API and the compiled interface, so the
# client gets a single public HTTPS URL.
#
# About the free plan, and the choice you have to make:
#
#   * There is no persistent disk, so the SQLite file lives on the container's
#     own filesystem. It survives while the instance is awake, and is recreated
#     from the workbook when the instance restarts or wakes from sleep.
#   * Free instances sleep after about 15 minutes of inactivity. The next visit
#     takes roughly 30-60 seconds to wake up.
#
#   That suits a single guided session. It does NOT suit leaving the link with
#   the client, because anything they post disappears once the instance sleeps.
#
# To make the data survive, point RPCI_DATABASE_URL at a hosted Postgres instead
# (Neon has a free tier). That is the only change needed — see DEPLOYMENT.md,
# option C. Set it in the Render dashboard:
#
#   RPCI_DATABASE_URL = postgresql://user:pass@host/db?sslmode=require
#
# Visitors can always press "Reset demo data" on the Dashboard to restore the
# workbook state, whichever database is in use.

services:
  - type: web
    name: rpci-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: RPCI_AUTO_SEED
        value: "true"
      - key: RPCI_SEED_FROM_EXCEL_PATH
        value: "/app/RPCI Accounts.xlsx"
      # SQLite by default. Override this in the dashboard with a Postgres URL to
      # make the data persistent.
      - key: RPCI_DATABASE_URL
        value: "sqlite:////data/rpci_demo.db"
      - key: RPCI_ALLOW_DEMO_RESET
        value: "true"
      - key: RPCI_CORS_ORIGINS
        value: "*"
