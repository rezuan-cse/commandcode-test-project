# Render blueprint for the client deployment.
#
# Service name is "rpci", so the public URL is https://rpci.onrender.com (Render
# appends a suffix if that subdomain is already taken by another workspace).
# The service tracks the "production" branch; push there to deploy.
#
# One Docker web service hosts both the API and the compiled interface, so the
# client gets a single public HTTPS URL.
#
# About the free plan, and the choice you have to make:
#
#   * There is no persistent disk, so a SQLite file lives on the container's own
#     filesystem. It survives while the instance is awake, and is **wiped** on the
#     next boot when the instance restarts or wakes from sleep. Posted data is
#     therefore lost unless a hosted Postgres is used.
#   * Free instances sleep after about 15 minutes of inactivity. The next visit
#     takes roughly 30-60 seconds to wake up.
#
# To make the data survive, set RPCI_DATABASE_URL in the Render dashboard to a
# hosted Postgres (Neon has a free tier). That is the only change needed — see
# DEPLOYMENT.md. An administrator can start the books over or import the client's
# workbook at any time from Administration → Data.

services:
  - type: web
    name: rpci
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: production
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # What a brand-new database starts with: fresh (starter chart of accounts),
      # workbook (the sample workbook), or none.
      - key: RPCI_SEED_MODE
        value: "fresh"
      - key: RPCI_SEED_FROM_EXCEL_PATH
        value: "/app/RPCI Accounts.xlsx"
      # Where the books live. Deliberately NOT set here.
      #
      # Do not hardcode a sqlite path: the free plan has no persistent disk, so
      # the file is wiped every time the instance sleeps and restarts, and all
      # posted data disappears. Set this in the Render dashboard to a hosted
      # Postgres connection string (Neon free tier), e.g.
      #
      #   RPCI_DATABASE_URL = postgresql://user:pass@host/db?sslmode=require
      #
      # Neon's direct or pooled host both work; prepared statements are disabled
      # for Postgres so a transaction-mode pooler is fine.
      #
      # `sync: false` means the dashboard value is used and is not overwritten by
      # a Blueprint sync. The application logs which database it is using on boot:
      #   [db] using postgresql database ... on ... (pooled)
      - key: RPCI_DATABASE_URL
        sync: false
      - key: RPCI_ALLOW_DATA_RESET
        value: "true"
      # The accounts that sign in are the client's own, not the seeded demo set.
      #
      # Accounts that already exist are never touched by this, so turning it off
      # does not remove the five @rpci.demo logins already in the database — they
      # stay usable until an administrator deletes them from Roles & Access. It
      # only stops new ones being created, which is what matters for a fresh
      # deployment holding real books. Make your own administrator first with:
      #
      #   backend/.venv/bin/python scripts/create_user.py --email you@example.com \
      #       --name "Your Name" --role admin
      - key: RPCI_SEED_DEMO_USERS
        value: "false"
      # Sign-in throttling: five wrong passwords lock the account for 15 minutes.
      - key: RPCI_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: RPCI_LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: RPCI_CORS_ORIGINS
        value: "*"
      # Session signing key. Render generates it once and keeps it, so sign-ins
      # survive restarts. Without it a random key is used per process and every
      # redeploy signs everybody out.
      - key: RPCI_JWT_SECRET
        generateValue: true
