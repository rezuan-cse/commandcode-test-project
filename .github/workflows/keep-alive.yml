name: Keep the service awake

# Render's free tier puts a web service to sleep after about 15 minutes without
# traffic. The next visit then waits 30-60 seconds while it starts again, which is
# a poor first impression for a client opening the link.
#
# WHY THIS FILE LOOKS UNUSUAL — read before changing the schedule
# ---------------------------------------------------------------
# This used to ask for a ping every 10 minutes (`cron: "*/10 * * * *"`). It was
# checked, and GitHub is not running it anything like that often. The recorded
# runs before this change were roughly:
#
#     2026-10-03 21:44
#     2026-10-04 00:07     (2h 23m later)
#     2026-10-04 05:47     (5h 40m later)
#
# Every one of those runs succeeded — so the workflow was working, and the service
# was still asleep between them. A direct request to /healthz took 51 seconds,
# which is a cold start: the instance had gone to sleep waiting for a ping that
# GitHub had silently dropped.
#
# This is documented behaviour rather than a bug. GitHub's scheduler is best
# effort, and it drops most slots for high-frequency schedules on public
# repositories. Asking for 144 runs a day and receiving three is normal.
#
# So the schedule is no longer the thing keeping the service warm. Instead:
#
#   * the workflow asks for ONE run every six hours — a request GitHub is far more
#     likely to honour, and one it only has to get right four times a day;
#   * that single run then pings every 9 minutes for just under six hours, from
#     inside the job, so the service is kept awake continuously;
#   * the runs butt up against each other, so there is no gap to sleep in.
#
# A long job is affordable because this repository is public, where Actions
# minutes are not charged. On a private repository a six-hour job would eat
# 2,000-minute allowances quickly, and the external monitor below would be the
# only sensible option.
#
# STILL TRUE, AND WORTH RE-READING IF IT STOPS WORKING
# ---------------------------------------------------
#   * Scheduled workflows run from the repository's DEFAULT branch only. That is
#     `main` here. A copy on another branch is ignored.
#   * GitHub disables scheduled workflows after 60 days without a push to the
#     repository. Any commit re-enables them.
#   * If the service is renamed or moved, update HEALTH_URL below. A wrong URL
#     shows up as a failing run rather than a silent one.
#
# The robust alternative is a dedicated uptime monitor — UptimeRobot,
# cron-job.org, Better Stack and others ping on a real schedule every 5 minutes on
# a free tier, and they alert you when the service is down. That needs an account
# somebody has to keep. This workflow is the option with no third-party
# involvement.

on:
  schedule:
    # Four times a day, at an off-the-hour minute so it is not competing with the
    # mass of jobs that ask for :00. The job then covers the next six hours.
    - cron: "17 */6 * * *"
  # Lets you run it by hand from the Actions tab, or warm the service on demand
  # before a demo. The `minutes` input controls how long it keeps pinging.
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep pinging for, in minutes"
        required: false
        default: "350"

# Nothing here needs a token: the only thing the job does is request a public URL.
permissions: {}

# One run at a time. A new run waits rather than cancelling the warm one, so the
# service is never left in the gap between two jobs.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # GitHub terminates a job at six hours. Stay just inside that, so the run ends
    # on its own terms and reports rather than being killed mid-sentence.
    timeout-minutes: 355
    env:
      # Change this if the service moves to another host.
      HEALTH_URL: https://rpci.onrender.com/healthz
      RUN_FOR_MINUTES: ${{ github.event.inputs.minutes || '350' }}
    steps:
      - name: Keep the health endpoint warm
        run: |
          set -uo pipefail

          # 9 minutes between pings. Render sleeps after about 15, so this leaves
          # roughly six minutes of headroom for a slow response or a delayed loop.
          INTERVAL=540

          end=$(( SECONDS + RUN_FOR_MINUTES * 60 ))
          pings=0
          woke=0
          failed=0

          echo "Keeping ${HEALTH_URL} awake for ${RUN_FOR_MINUTES} minute(s)."

          while [ "$SECONDS" -lt "$end" ]; do
            # 000 means curl could not connect at all, which is what a cold start
            # looks like from here; the 90-second ceiling gives it time to wake.
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              --max-time 90 "$HEALTH_URL" 2>/dev/null) || code="000"
            code=${code:-000}
            pings=$((pings + 1))

            elapsed=$(( SECONDS / 60 ))
            if [ "$code" = "200" ]; then
              woke=$((woke + 1))
              echo "[${elapsed}m] HTTP 200 — awake"
            else
              failed=$((failed + 1))
              echo "[${elapsed}m] HTTP ${code} — not responding; will retry in 20s"
              # A short gap before retrying, so a wake-up has time to finish rather
              # than being hit again immediately.
              sleep 20
            fi

            sleep "$INTERVAL"
          done

          echo "Finished after ${pings} request(s): ${woke} awake, ${failed} not responding."

          # Only a run that never got a single 200 is treated as a failure worth
          # alerting on. A few bad responses across six hours is a cold start, not
          # an outage, and failing the run for those would train everyone to ignore
          # the red crosses.
          if [ "$woke" -eq 0 ]; then
            echo "::error::${HEALTH_URL} never returned 200. The service may be down, renamed, or the URL may have changed."
            exit 1
          fi

          if [ "$failed" -gt 0 ]; then
            echo "::warning::${failed} of ${pings} requests did not return 200. Check the logs for the codes."
          fi
