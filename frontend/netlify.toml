# Netlify configuration for the interface.
#
# Netlify serves the single-page app and rewrites unknown paths back to
# index.html so deep links work. Netlify does not apply a rewrite when a real
# static file matches, so assets are served normally.

[build]
  command = "npm run build"
  publish = "dist"

# Set VITE_API_BASE in the Netlify dashboard (Site settings → Environment
# variables) to the API's public URL, e.g. https://rpci-demo.onrender.com/api

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
